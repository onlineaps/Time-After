<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Time After</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f4f6f9">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1c232b; --muted:#8b95a1; --line:#dde3ea;
  --accent:#3682c8; --accent-ink:#ffffff; --warm:#d9700f; --warm-ink:#ffffff; --soft:#e9eff6; --err:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#0f1114; --ink:#eef2f6; --muted:#6c7683; --line:#232830;
  --accent:#7db9ee; --accent-ink:#06121f; --warm:#f2a35e; --warm-ink:#1d1002; --soft:#1a1e24; --err:#ff8a80;
  color-scheme:dark;
}
:root.calc{--accent:var(--warm);--accent-ink:var(--warm-ink)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Bengali",sans-serif;display:flex;justify-content:center;padding:6px 16px 100px;transition:background .25s,color .25s}
.wrap{width:100%;max-width:420px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:20px;margin:0;font-weight:700}
button{font-family:inherit}
#theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
button:focus-visible,#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{margin-bottom:10px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px;text-align:center;height:120px;display:flex;flex-direction:column;justify-content:center}
.result .big{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.result .sub{font-size:15px;opacity:.92;margin-top:4px}
.result.calc{background:var(--warm);color:var(--warm-ink)}
.result.empty{background:var(--card);color:var(--muted);border:1px dashed var(--line)}
.result.error{background:var(--card);color:var(--err);border:1px solid var(--err)}

.picker{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cols{display:flex;gap:10px}
.col{flex:1;text-align:center}
.lbl{font-size:13px;color:var(--muted);margin-bottom:2px}
.wbox{position:relative;height:192px}
.wbox::before{content:"";position:absolute;left:0;right:0;top:64px;height:64px;background:var(--soft);border-radius:16px}
.wheel{position:relative;height:100%;overflow-y:scroll;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.sp{height:64px}
.it{height:64px;line-height:64px;font-size:34px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
.it.on{color:var(--ink);font-size:52px;font-weight:700}

.qrow{display:flex;gap:8px;margin-bottom:10px}
#q{user-select:text;-webkit-user-select:text;flex:1;min-width:0;font-size:20px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
#q::placeholder{color:var(--muted);font-size:15px}
#reset{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer}
#reset:active{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
header{position:relative}
.hbtns{display:flex;gap:8px;align-items:center}
#gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:40px;height:36px;font-size:17px;cursor:pointer}
.panel{position:absolute;right:0;top:calc(100% + 6px);width:270px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:40}
.ptitle{font-weight:700;margin-bottom:8px}
.pbtn{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.pnote{color:var(--muted);font-size:13px;line-height:1.5}
.ibanner{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:396px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:30}
.itxt{flex:1;font-size:14px;line-height:1.35}
.ibtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.ix{border:0;background:transparent;color:var(--muted);font-size:18px;padding:6px 8px;cursor:pointer}
#theme{display:inline-flex;align-items:center;gap:6px}
#gear{display:inline-grid;place-items:center}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.ix{display:grid;place-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;cursor:pointer}
.tab span{display:grid}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:15;cursor:pointer}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.utop{display:flex;align-items:center;gap:6px}
.uname{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.25;word-break:break-word;color:var(--prog)}
.ubtn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:10px;cursor:pointer;display:flex;align-items:center}
.ubtn.arm{color:var(--err)}
.ubtn.arm::after{content:"মুছবেন?";font-size:12px;margin-left:4px}
.urow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.uend{color:var(--warm);font-size:14px;font-weight:700;white-space:nowrap;margin-left:auto}
.urem{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;margin:2px 0 6px}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--prog);border-radius:99px;clip-path:inset(0 100% 0 0 round 99px)}
:root{--ok:#1f9d55}
:root[data-theme="dark"]{--ok:#4cd08a}
.ucard.done .urem{color:var(--ok);display:flex;align-items:center;gap:8px}
.ucard.done .bar i{background:var(--ok)}
.upempty{text-align:center;color:var(--muted);padding:44px 10px;font-size:15px;line-height:1.6}
.uprow{display:flex;gap:8px;margin-top:6px}
.ghost{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center}
.sv{flex:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end}
.sheetbox{width:100%;max-width:420px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:100%;overflow-y:auto}
.sheetbox .seg{display:none}
.sheetbox .picker{margin-bottom:0}
.sname{user-select:text;-webkit-user-select:text;width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:10px}
.sprev{text-align:center;color:var(--muted);font-size:15px;margin:10px 0 6px;min-height:22px}
.uphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.livetime{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.lwd{color:var(--warm);font-size:16px}
.clr{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;cursor:pointer}
.clr.arm{color:var(--err)}
.uptools{display:flex;align-items:center}
.badge{background:var(--warm);color:var(--warm-ink);font-size:14px;font-weight:700;padding:5px 10px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kb .tabs,.kb .fab,.kb .ibanner{display:none}
:root{--prog:#0a9d96}
:root[data-theme="dark"]{--prog:#03fcf0}
.ucard{cursor:pointer}
.urow{margin:4px 0 6px}
.ucard:not(.open) .urem,.ucard:not(.open) .ubtn,.ucard:not(.open) .pct{display:none}
.ucard.open .uend{padding-right:0}
.ucard.done .uname{color:var(--ok)}
.ucard.done .uend{display:flex;align-items:center;gap:4px;color:var(--ok)}
.ucard.open.done .uend{padding-right:38px}
.ucard.done .urem{display:none}
.pct{font-size:13px;color:var(--muted);margin-top:6px;text-align:right}
.ucol{flex:1;min-width:0}
.uacc{font-size:13px;color:var(--muted);margin-top:1px}
.uacc:empty{display:none}
.saccs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.achip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer}
.achip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pt2{margin-top:12px}
.alist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.aitem{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--soft);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px}
.aitem button{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:4px;cursor:pointer}
.arow{display:flex;gap:6px}
.anew{user-select:text;-webkit-user-select:text;flex:1;min-width:0;font-size:14px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.aadd{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 12px;font-weight:600;font-size:14px;cursor:pointer}
.ucard{-webkit-touch-callout:none;user-select:none}
.ucard.ghost{position:fixed;margin:0;z-index:60;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:none;will-change:transform;transform:scale(1.04)}
.ucard.dim{opacity:.25}
.trash{position:fixed;left:50%;margin-left:-38px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;background:var(--card);border:2px solid var(--err);color:var(--err);display:grid;place-items:center;z-index:55;opacity:0;transform:translateY(30px) scale(.7);transition:transform .25s cubic-bezier(.2,.9,.3,1.2),opacity .2s,background .15s;pointer-events:none}
.trash.show{opacity:1;transform:none}
.trash.hot{background:var(--err);color:#fff;transform:scale(1.25)}
.trash.eat{animation:eat .38s}
@keyframes eat{0%{transform:scale(1.25)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.toast{position:fixed;left:12px;right:12px;max-width:396px;margin:0 auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.4);border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;z-index:56;font-size:14px;font-weight:600}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:15px;padding:8px 12px;cursor:pointer}
.pager{overflow-x:hidden;overflow-x:clip}
html,body,.pager,#tab-calc{touch-action:none}
#tab-up{touch-action:none;max-height:calc(100dvh - 170px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:84px}
#tab-up.scrolls{touch-action:pan-y}
.track{display:flex;will-change:transform}
.track>section{flex:0 0 100%;min-width:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Time After</h1>
    <div class="hbtns">
      <button id="gear" type="button" aria-label="Settings" aria-expanded="false"><span data-ic="gear" data-s="18"></span></button>
      <button id="theme" type="button" aria-label="Theme toggle"></button>
    </div>
    <div id="panel" class="panel" hidden>
      <div class="ptitle">Settings</div>
      <button id="sinstall" type="button" class="pbtn" hidden><span data-ic="down" data-s="18"></span> Install app</button>
      <div id="snote" class="pnote"></div>
      <div class="ptitle pt2">Accounts</div>
      <div id="alist" class="alist"></div>
      <div class="arow"><input id="anew" class="anew" type="text" maxlength="40" enterkeyhint="done" autocomplete="off" placeholder="নতুন আইডির নাম"><button id="aadd" type="button" class="aadd">Add</button></div>
    </div>
  </header>

  <div id="pager" class="pager"><div id="track" class="track">
  <section id="tab-calc">
  <div id="res" class="result" aria-live="polite"></div>

  <div class="qrow">
    <input id="q" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" placeholder="অথবা লিখুন: 4h, 30m, 2h 30m, -2h, 1d" aria-label="Duration">
    <button id="reset" type="button" aria-label="Reset">Reset</button>
  </div>

  <div class="picker">
    <div class="seg" role="group" aria-label="Direction">
      <button type="button" id="after" aria-pressed="true">After</button>
      <button type="button" id="before" aria-pressed="false">Before</button>
    </div>
    <div class="cols">
      <div class="col"><div class="lbl">Day</div><div class="wbox"><div class="wheel" id="wd" role="listbox" aria-label="Day"></div></div></div>
      <div class="col"><div class="lbl">Hour</div><div class="wbox"><div class="wheel" id="wh" role="listbox" aria-label="Hour"></div></div></div>
      <div class="col"><div class="lbl">Minute</div><div class="wbox"><div class="wheel" id="wm" role="listbox" aria-label="Minute"></div></div></div>
    </div>
  </div>

  </section>

  <section id="tab-up">
    <div class="uphead"><div id="livetime" class="livetime"></div><div class="uptools"><button id="upsort" type="button" class="clr"><span data-ic="sort" data-s="16"></span><span class="srt">Newest</span></button><button id="upclear" type="button" class="clr" hidden><span data-ic="trash" data-s="16"></span><span class="clt">Clear all</span></button></div></div>
    <div id="uplist"></div>
    <div id="upempty" class="upempty">এখনো কোনো আপগ্রেড নেই।<br>নিচের কোণার "+" বাটন চাপুন।</div>
  </section>
  </div></div>
</div>

<nav class="tabs" aria-label="Tabs">
  <button id="tbcalc" class="tab" type="button" aria-selected="true"><span data-ic="clock" data-s="22"></span>Calculator</button>
  <button id="tbup" class="tab" type="button" aria-selected="false"><span data-ic="hour" data-s="22"></span>Upgrades</button>
</nav>
<button id="fab" class="fab" type="button" aria-label="New upgrade" hidden><span data-ic="plus" data-s="26"></span></button>

<div id="trash" class="trash" hidden><span data-ic="trash" data-s="32"></span></div>
<div id="toast" class="toast" hidden><span>মুছে গেছে</span><button id="undo" type="button">Undo</button></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheetbox">
    <input id="sname" class="sname" enterkeyhint="done" type="text" maxlength="60" autocomplete="off" placeholder="নাম, যেমন: Wizard Tower">
    <div id="sacc" class="saccs"></div>
    <div id="sheetpick"></div>
    <div id="sprev" class="sprev">সময় বেছে নিন</div>
    <div class="uprow">
      <button id="scancel" type="button" class="ghost">Cancel</button>
      <button id="ssave" type="button" class="pbtn sv">Save</button>
    </div>
  </div>
</div>

<div id="ibanner" class="ibanner" hidden>
  <div class="itxt">Time After হোম স্ক্রিনে install করুন</div>
  <button id="ibtn" type="button" class="ibtn">Install</button>
  <button id="idismiss" type="button" class="ix" aria-label="Close"><span data-ic="close" data-s="18"></span></button>
</div>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme');
  var q=document.getElementById('q'), res=document.getElementById('res');
  var bAfter=document.getElementById('after'), bBefore=document.getElementById('before');

  var BN_DIGITS=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  var BN_MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  var BN_DAYS=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  function bn(n){return String(n).replace(/\d/g,function(d){return BN_DIGITS[+d];});}
  function bnDate(d){return BN_DAYS[d.getDay()]+', '+bn(d.getDate())+' '+BN_MONTHS[d.getMonth()];}

  /* ---- SVG icons ---- */
  var IC={
    gear:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
    moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
    up:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    sort:'<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>',
    check:'<path d="M5 13l4 4L19 7"/>',
    redo:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/>',
    close:'<path d="M6 6l12 12M18 6L6 18"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    hour:'<path d="M6 3h12M6 21h12M8 3v4l4 5-4 5v4M16 3v4l-4 5 4 5v4"/>'
  };
  function ic(n,sz){sz=sz||20;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';}
  Array.prototype.forEach.call(document.querySelectorAll('[data-ic]'),function(e){e.innerHTML=ic(e.getAttribute('data-ic'),+e.getAttribute('data-s')||20);});

  /* theme (default light) */
  function setTheme(t){
    if(t==='dark'){root.setAttribute('data-theme','dark');btn.innerHTML=ic('sun',18)+' Light';}
    else{root.removeAttribute('data-theme');btn.innerHTML=ic('moon',18)+' Dark';}
    var tm=document.querySelector('meta[name=theme-color]'); if(tm) tm.setAttribute('content',t==='dark'?'#000000':'#f4f6f9');
  }
  var saved=null; try{saved=localStorage.getItem('timeafter-theme');}catch(e){}
  setTheme(saved==='dark'?'dark':'light');
  btn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    setTheme(next); try{localStorage.setItem('timeafter-theme',next);}catch(e){}
  });

  function moveDrag(e){
    drag.dx=e.clientX-drag.sx; drag.dy=e.clientY-drag.sy;
    drag.ghost.style.transform='translate('+drag.dx+'px,'+drag.dy+'px) scale(1.04)';
    var tr=trashEl.getBoundingClientRect();
    var over=e.clientX>=tr.left-24&&e.clientX<=tr.right+24&&e.clientY>=tr.top-24&&e.clientY<=tr.bottom+24;
    if(over!==drag.over){drag.over=over;trashEl.classList.toggle('hot',over);if(over&&navigator.vibrate){try{navigator.vibrate(15);}catch(x){}}}
  }
  function finishDrag(cancel){
    var g=drag.ghost, c=drag.el, hot=drag.over&&!cancel, it=find(c.getAttribute('data-id'));
    drag.on=false; drag.suppress=true; setTimeout(function(){drag.suppress=false;},150);
    if(hot&&it){
      var tr=trashEl.getBoundingClientRect(), r=drag.rect;
      var tx=tr.left+tr.width/2-(r.left+r.width/2), ty=tr.top+tr.height/2-(r.top+r.height/2);
      g.style.transition='transform .38s cubic-bezier(.55,0,.8,.3),opacity .38s ease-in';
      g.style.transform='translate('+tx+'px,'+ty+'px) scale(.06)'; g.style.opacity='0';
      setTimeout(function(){
        if(g.parentNode)g.parentNode.removeChild(g);
        trashEl.classList.add('eat'); setTimeout(function(){trashEl.classList.remove('eat');},400);
        trashOff();
        items=items.filter(function(x){return x!==it;}); save(); showUndo(it);
        c.classList.remove('dim');
        c.style.height=c.offsetHeight+'px'; c.style.overflow='hidden';
        c.style.transition='height .26s ease,margin .26s ease,padding .26s ease,opacity .2s,border-width .26s';
        requestAnimationFrame(function(){c.style.height='0';c.style.marginBottom='0';c.style.paddingTop='0';c.style.paddingBottom='0';c.style.opacity='0';c.style.borderWidth='0';});
        setTimeout(renderUp,290);
      },380);
    }else{
      g.style.transition='transform .25s cubic-bezier(.2,.9,.3,1)'; g.style.transform='translate(0,0) scale(1)';
      setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);c.classList.remove('dim');},250);
      trashOff();
    }
    drag.ghost=null; drag.over=false;
  }
  ulist.addEventListener('pointerdown',function(e){
    var c=e.target.closest?e.target.closest('.ucard'):null;
    if(!c||sheetOpen||drag.on||(e.pointerType==='mouse'&&e.button!==0)||e.target.closest('[data-a]'))return;
    drag.el=c; drag.id=e.pointerId; drag.sx=e.clientX; drag.sy=e.clientY; drag.pending=true;
    clearTimeout(drag.t); drag.t=setTimeout(startDrag,600);
  });
  document.addEventListener('pointermove',function(e){
    if(e.pointerId!==drag.id)return;
    if(drag.pending&&(Math.abs(e.clientX-drag.sx)>10||Math.abs(e.clientY-drag.sy)>10)){clearTimeout(drag.t);drag.pending=false;}
    if(drag.on)moveDrag(e);
  });
  function dragEnd(e,cancel){
    if(e.pointerId!==drag.id)return;
    clearTimeout(drag.t); drag.pending=false;
    if(drag.on)finishDrag(cancel);
  }
  document.addEventListener('pointerup',function(e){dragEnd(e,false);});
  document.addEventListener('pointercancel',function(e){dragEnd(e,true);});
  document.addEventListener('touchmove',function(e){if(drag.on&&e.cancelable)e.preventDefault();},{passive:false});
  ulist.addEventListener('contextmenu',function(e){e.preventDefault();});

  /* ---- keyboard handling ---- */
  [q,sname].forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});});
  document.addEventListener('focusin',function(e){if(e.target&&e.target.tagName==='INPUT')document.body.classList.add('kb');});
  document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!a||a.tagName!=='INPUT')document.body.classList.remove('kb');},50);});
  if(window.visualViewport){
    var vv=window.visualViewport;
    var fit=function(){sheet.style.top=vv.offsetTop+'px';sheet.style.height=vv.height+'px';sheet.style.bottom='auto';};
    vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit); fit();
  }

  /* ---- PWA install (banner + Settings button) ---- */
  var deferred=null;
  var banner=document.getElementById('ibanner'), ibtn=document.getElementById('ibtn'), idismiss=document.getElementById('idismiss');
  var sInstall=document.getElementById('sinstall'), sNote=document.getElementById('snote');
  var gear=document.getElementById('gear'), panel=document.getElementById('panel');
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  function bannerDismissed(){try{return localStorage.getItem('ta-ib')==='1';}catch(e){return false;}}
  function refreshInstallUI(){
    if(standalone){sInstall.hidden=true;sNote.textContent='App ইনস্টল করা আছে';banner.hidden=true;return;}
    if(deferred){sInstall.hidden=false;sNote.textContent='';banner.hidden=bannerDismissed();}
    else{sInstall.hidden=true;sNote.textContent='Install করতে ব্রাউজার মেনু (⋮) → Install app / Add to Home screen চাপুন।';banner.hidden=true;}
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;refreshInstallUI();});
  window.addEventListener('appinstalled',function(){deferred=null;standalone=true;refreshInstallUI();});
  function doInstall(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){deferred=null;refreshInstallUI();}).catch(function(){});
  }
  ibtn.addEventListener('click',doInstall);
  sInstall.addEventListener('click',doInstall);
  idismiss.addEventListener('click',function(){banner.hidden=true;try{localStorage.setItem('ta-ib','1');}catch(e){}});
  gear.addEventListener('click',function(){panel.hidden=!panel.hidden;gear.setAttribute('aria-expanded',panel.hidden?'false':'true');});
  document.addEventListener('click',function(e){
    if(!panel.hidden&&!panel.contains(e.target)&&e.target!==gear){panel.hidden=true;gear.setAttribute('aria-expanded','false');}
  });
  refreshInstallUI();
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
    });
  }

  writePicker(); tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
